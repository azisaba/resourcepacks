name: CI

on:
  push:
    branches: [ main ]

jobs:
  build_and_release:
    permissions:
      contents: write
    name: ビルド & リリース
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: FloatingImageの最新版を取得する
        run: curl -fsSL -o "$RUNNER_TEMP/FloatingImage.jar" https://github.com/AzisabaNetwork/FloatingImage/releases/latest/download/FloatingImage.jar

      - name: FloatingImageの画像をリソースパックに変換する
        run: |
          for dir in */floatingimage; do
            [ -d "$dir" ] || continue
            pack="${dir%/floatingimage}"
            java -jar "$RUNNER_TEMP/FloatingImage.jar" generate --images "$dir" --out "$pack"
          done

      - name: リソースパックとして機能するディレクトリを見つける
        run: find . -mindepth 2 -maxdepth 2 -type f -iname pack.mcmeta | parallel echo {//} > pack.txt

      - name: 見つけたディレクトリからリソースパックの作成
        run: parallel -a pack.txt --wd {} zip -r "$PWD"/{/}.zip . -x ".idea/*" "*/.idea/*" "floatingimage/*"

      - name: 作成したリソースパックを表示する
        run: find . -maxdepth 1 -type f -name "*.zip"

      - uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: action-v${{ github.run_number }}
          files: '*.zip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
